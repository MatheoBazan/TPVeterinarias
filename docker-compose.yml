services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Falta POSTGRES_USER, copia env.example a .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD, copia env.example a .env}"
      POSTGRES_DB: ${POSTGRES_DB:-veterinaria}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  datos_postgres:
